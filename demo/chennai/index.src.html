<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chennai Mobility AI — Every Commuter. Every Bus. Any Phone.</title>
<meta name="description" content="A 150-second real-time WebGL film: a Chennai commuter with a keypad phone calls the CUMTA helpline, and an 8 kHz telephony pipeline routes him onto MTC Bus 54 with a 148-character SMS.">
<style>
  :root{
    --asphalt:#12161A; --puddle:#1E232A; --mtc:#B91C1C; --route:#EA580C;
    --sodium:#F59E0B; --indigo:#0B132B; --lcd:#84CC16;
    --ink:#E9F0F6; --dim:#8FA3B5;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --cond:"Oswald","Arial Narrow",Impact,"Haettenschweiler",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#04070B;color:var(--ink);
    font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
  body{overscroll-behavior:none;touch-action:manipulation}

  /* ---- the two stacked canvases: WebGL picture + 2D instrument overlay ---- */
  #gl,#overlay{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:0;background:#04070B}
  #overlay{z-index:2;pointer-events:none}

  /* ---- chrome that sits above the picture but never intercepts the film --- */
  .ui{position:fixed;z-index:4}
  #brand{left:18px;top:26px;pointer-events:none;line-height:1.35}
  #brand .t1{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.24em;
    color:var(--sodium);text-transform:uppercase}
  #brand .t2{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:3px}

  #chip{right:18px;bottom:18px;display:flex;gap:8px;align-items:center;pointer-events:none;
    font-size:9px;letter-spacing:.13em;color:rgba(198,216,232,.55);text-transform:uppercase}
  #chip .dot{width:5px;height:5px;border-radius:50%;background:var(--lcd);
    box-shadow:0 0 8px var(--lcd);animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  #rec{right:18px;bottom:44px;appearance:none;border:1px solid rgba(185,28,28,.55);
    background:rgba(10,14,20,.62);color:#F3D3D3;font-family:var(--mono);font-size:10px;
    font-weight:700;letter-spacing:.14em;padding:8px 13px;border-radius:3px;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:.18s;text-transform:uppercase}
  #rec:hover{border-color:#EF4444;color:#fff;background:rgba(28,12,14,.8)}
  #rec.live{border-color:#EF4444;color:#fff;background:rgba(127,20,24,.72);
    animation:recpulse 1.15s steps(1,end) infinite}
  @keyframes recpulse{0%,60%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}61%,100%{box-shadow:0 0 0 7px rgba(239,68,68,0)}}

  /* ---- boot card: only ever visible before the first rendered frame ---- */
  #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 45%,#0C1420 0%,#04070B 70%)}
  #boot .in{width:min(560px,84vw);text-align:center}
  #boot h1{font-family:var(--cond);font-weight:700;font-size:clamp(21px,3.4vw,32px);
    letter-spacing:.16em;margin:0 0 10px;color:#fff;text-transform:uppercase}
  #boot p{font-size:10.5px;letter-spacing:.13em;color:var(--dim);margin:0 0 24px;text-transform:uppercase}
  #boot .bar{height:2px;background:rgba(120,150,180,.16);border-radius:2px;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,rgba(185,28,28,.5),var(--route),var(--sodium));
    animation:sweep 1.25s cubic-bezier(.6,.05,.35,.95) infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  #boot .rule{margin:22px auto 0;width:64px;height:1px;background:rgba(245,158,11,.4)}

  /* ---- fatal card ---- */
  #fatal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 45%,#14100C 0%,#04070B 72%);padding:24px}
  #fatal[hidden]{display:none}
  #fatal .fcard{max-width:620px;border:1px solid rgba(245,158,11,.3);border-left:3px solid var(--sodium);
    background:rgba(12,16,22,.86);padding:28px 30px;border-radius:4px}
  #fatal h1{font-family:var(--cond);font-size:20px;letter-spacing:.16em;margin:0 0 12px;color:var(--sodium);text-transform:uppercase}
  #fatal p{font-size:12.5px;line-height:1.72;color:#D5E2EC;margin:0}

  @media (max-width:640px){
    #brand{top:22px;left:12px}
    #chip{right:12px;bottom:12px;font-size:8px}
    #rec{right:12px;bottom:34px;font-size:9px;padding:7px 10px}
  }
  @media (prefers-reduced-motion:reduce){
    #boot .bar i,#chip .dot,#rec.live{animation:none}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>

<div id="boot" class="ui">
  <div class="in">
    <h1>Chennai Mobility AI</h1>
    <p>Building the street &middot; Poonamallee High Road</p>
    <div class="bar"><i></i></div>
    <div class="rule"></div>
  </div>
</div>

<div id="brand" class="ui">
  <div class="t1">Chennai Mobility AI</div>
  <div class="t2">CUMTA &middot; 8 kHz telephony &middot; GTFS routing &middot; DTMF &rarr; SMS</div>
</div>

<div id="chip" class="ui"><span class="dot"></span>Real-time procedural WebGL &middot; no stock footage &middot; autonomous 02:30 timeline</div>
<button id="rec" class="ui" type="button" title="Export a 1080p WebM of the full 150-second timeline (R)">&#9679; Record 1080p</button>

<div id="fatal" hidden></div>

<script>/*__THREE__*/</script>
<script>
/*__SRC__*/
</script>
</body>
</html>
